# nginx for perps.abhishekbr.dev — web (Next.js :3001) + backend API (:3000)
# Install on the VM:
#   sudo cp deploy/nginx/perps.conf /etc/nginx/sites-available/perps.conf
#   sudo ln -sf /etc/nginx/sites-available/perps.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Certbot has already added the SSL bits to your live config — if you replace
# the file, re-run: sudo certbot --nginx -d perps.abhishekbr.dev

server {
    listen 80;
    server_name perps.abhishekbr.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name perps.abhishekbr.dev;

    ssl_certificate /etc/letsencrypt/live/perps.abhishekbr.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perps.abhishekbr.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Backend API routes (express on :3000). Must match apps/backend/src/routes/*.
    location ~ ^/(health|signup|signin|onramp|order|orders|equity|positions|fills|depth|price|markets|admin)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Next.js frontend (:3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
